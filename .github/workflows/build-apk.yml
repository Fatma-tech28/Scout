name: Build APK

# Builds a release APK on every push to main and on version tags.
# - Every run: the APK is attached as a downloadable build artifact
#   (Actions tab -> the run -> Artifacts).
# - Tag pushes like "v1.0.0": the APK is also attached to a GitHub
#   Release automatically.
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Scaffold platform folders (android/ios) if missing
        # This repo ships lib/ + pubspec.yaml only. `flutter create .` fills
        # in the platform-specific folders (Gradle wrapper, manifests, etc.)
        # from the installed Flutter version's own template without
        # touching existing Dart code. Safe to re-run on every build.
        run: flutter create --platforms=android --org com.inspectionrover .

      - name: Allow cleartext (ws://) traffic for the local ESP32 connection
        # The generated manifest is fresh every run (see step above), so
        # this can't be a one-time manual edit — it has to be reapplied
        # here every time. Without it, Android blocks the app's plain
        # ws:// connection to the rover's AP by default (API 28+), and the
        # "Connect" button just hangs on "connecting" forever with nothing
        # ever reaching the ESP32.
        run: |
          sed -i 's/<application/<application\n        android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          grep -n "usesCleartextTraffic" android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: inspection-rover-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
